# google-java-format reaches into jdk.compiler internals, which are closed by
# default from JDK 16 onward. Spotless runs it inside the Gradle daemon, so the
# exports have to be opened here or every spotlessJava task fails with
# InvocationTargetException. This is the formatter's documented requirement, not
# a workaround for this project.
org.gradle.jvmargs=-Xmx2g \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED

# No automatic retries or parallel non-determinism in the build (NFR-001).
org.gradle.parallel=false
org.gradle.caching=false
