# Eval suite for the secure-coding skill.
# The provider loads .claude/skills/secure-coding.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for secure-coding skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/secure-coding.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: identical 404 for malformed and unknown confirmation codes"
    vars:
      user_message: A confirmation code arrives that is only 9 characters long. A different code arrives that is exactly 10 valid characters but matches no row in the database. Should these two cases return different responses?
    assert:
      - type: contains
        value: identical
