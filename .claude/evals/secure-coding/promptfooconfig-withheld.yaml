# Withheld-skill proof for secure-coding. Identical to promptfooconfig.yaml except that
# the system prompt is a generic assistant with none of the project's standards.
# This MUST fail: if it passes, the suite is measuring the model rather than the
# artifact (NFR-012 item 1). Verified by .claude/evals/verify-withheld.mjs, which
# also rejects a run that merely errored.

description: Withheld-skill proof for secure-coding — must fail
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/evals/withheld-system-prompt.txt
prompts:
  - "{{user_message}}"
tests:
  - description: "WITHHELD SKILL — must fail: model may not know identical-response discipline"
    vars:
      user_message: A confirmation code arrives that is only 9 characters long. A different code arrives that is exactly 10 valid characters but matches no row in the database. Should these two cases return the same response body with the same status code?
    assert:
      - type: contains
        value: booking_not_found
