# Eval suite for the escalation-protocol skill.
# The provider loads .claude/skills/escalation-protocol.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for escalation-protocol skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/escalation-protocol.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: escalates on undocumented issue code"
    vars:
      user_message: I need to add a new validation error for a booking request that contains an emoji in the name field. What issue code should I use and how should I add it?
    assert:
      - type: contains
        value: GitHub issue
      - type: contains
        value: stop
