# Eval suite for the requirement-docs skill.
# The provider loads .claude/skills/requirement-docs.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for requirement-docs skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/requirement-docs.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: produces TC-FR ID format for a new test case"
    vars:
      user_message: I'm writing the verification plan for FR-001. What ID should I assign to the first test case that verifies the 7-day window boundary?
    assert:
      - type: contains
        value: TC-FR-001-1
