# Withheld-skill proof for requirement-docs. Identical to promptfooconfig.yaml except that
# the system prompt is a generic assistant with none of the project's standards.
# This MUST fail: if it passes, the suite is measuring the model rather than the
# artifact (NFR-012 item 1). Verified by .claude/evals/verify-withheld.mjs, which
# also rejects a run that merely errored.

description: Withheld-skill proof for requirement-docs — must fail
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/evals/withheld-system-prompt.txt
prompts:
  - "{{user_message}}"
tests:
  - description: "WITHHELD SKILL — must fail: model won't know the TC-FR format"
    vars:
      user_message: I'm writing the verification plan for FR-001. What ID should I assign to the first test case that verifies the 7-day window boundary?
    assert:
      - type: contains
        value: TC-FR-001-1
