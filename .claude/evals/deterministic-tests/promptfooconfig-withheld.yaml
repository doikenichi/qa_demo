description: "Withheld-skill proof for deterministic-tests — must fail"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      max_tokens: 400

prompts:
  - "{{user_message}}"

tests:
  - description: "WITHHELD SKILL — must fail: model suggests system clock or sleep"
    vars:
      user_message: "I need to write a test that verifies cancellation is refused at exactly slotStart. How should I control time in this test?"
    options:
      provider:
        config:
          system: "You are a helpful software engineering assistant."
    assert:
      - type: contains
        value: "injected clock"
