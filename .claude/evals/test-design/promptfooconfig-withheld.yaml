description: "Withheld-skill proof for test-design — must fail"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      max_tokens: 400

prompts:
  - "{{user_message}}"

tests:
  - description: "WITHHELD SKILL — must fail: model won't name the lowest-level rule"
    vars:
      user_message: "I need to test that an email address with a space in it (like 'a b@example.com') is rejected. Should this be a unit test, integration test, or E2E test?"
    options:
      provider:
        config:
          system: "You are a helpful software engineering assistant."
    assert:
      - type: contains
        value: "lowest level"
