# Eval suite for the java-patterns skill.
# The provider loads .claude/skills/java-patterns.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for java-patterns skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/java-patterns.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: abstraction waits for a second caller"
    vars:
      user_message: I have three similar lines of booking validation logic and I expect more callers later. Should I extract an abstraction now?
    assert:
      # Chosen by measurement. contains "ports and adapters" was flaky: the
      # model describes the pattern correctly ("a domain core plus adapters",
      # "depends only on ports") without using that exact phrase, so the
      # suite went red on a correct answer. Loosening it to ports + adapters
      # separately would have destroyed discrimination instead, since
      # hexagonal architecture is standard advice a generic assistant gives.
      #
      # "second caller" is this codebase's own trigger for introducing an
      # abstraction. A generic assistant reaches for the rule of three or
      # "when you see duplication".
      - type: icontains
        value: second caller
