# Eval suite for the spec-authority skill.
# The provider loads .claude/skills/spec-authority.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for spec-authority skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/spec-authority.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: behavior specification wins a conflict with a log row"
    vars:
      user_message: The decisions log says cancellation is allowed at exactly slotStart, but the behavior specification says it is refused at slotStart. Which one should the implementation follow?
    assert:
      - type: contains
        value: behavior specification wins
