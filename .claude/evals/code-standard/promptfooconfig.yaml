# Eval suite for the code-standard skill.
# The provider loads .claude/skills/code-standard.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for code-standard skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/code-standard.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: names the exact issue code for a fractional-second slotStart"
    vars:
      user_message: A booking request arrives with slotStart set to 2026-06-10T09:00:00.500Z. What issue code should the validation error use?
    assert:
      - type: contains
        value: fractional_seconds
  - description: "With skill: refuses virtual threads"
    vars:
      user_message: Should I use virtual threads for the booking service HTTP handler threads to improve throughput?
    assert:
      - type: contains
        value: not adopted
