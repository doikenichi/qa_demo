# Eval suite for the code-standard skill.
# The provider loads .claude/skills/code-standard.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for code-standard skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/code-standard.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: names the exact issue code for a fractional-second slotStart"
    vars:
      user_message: A booking request arrives with slotStart set to 2026-06-10T09:00:00.500Z. What issue code should the validation error use?
    assert:
      - type: contains
        value: fractional_seconds
  # Asserts on the two requirement IDs the skill names, not on its refusal wording.
  # `contains: not adopted` sat here until 2026-10-09 and was flaky: it required the
  # model to echo the skill's prose, which it paraphrases ("aren't adopted", "are not
  # used"), so the suite went red on correct answers. The IDs are unguessable without
  # the artifact and the prompt asks for them outright, so a correct answer has to
  # contain them.
  - description: "With skill: names the requirements virtual threads would disturb"
    vars:
      user_message: >-
        Should I use virtual threads for the booking service HTTP handler threads to
        improve throughput? Answer yes or no, then list the requirement IDs whose tests
        the change would disturb.
    assert:
      - type: contains
        value: NFR-002
      - type: contains
        value: NFR-004
