description: "Withheld-skill proof for code-standard — must fail"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      max_tokens: 400

prompts:
  - "{{user_message}}"

tests:
  - description: "WITHHELD SKILL — must fail: model doesn't know the specific issue code name"
    vars:
      user_message: "A booking request arrives with slotStart set to 2026-06-10T09:00:00.500Z. What issue code should the validation error use?"
    options:
      provider:
        config:
          system: "You are a helpful software engineering assistant."
    assert:
      - type: contains
        value: "fractional_seconds"
