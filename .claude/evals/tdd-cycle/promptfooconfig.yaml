description: Eval suite for tdd-cycle skill

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      max_tokens: 400

prompts:
  - "{{user_message}}"

tests:
  - description: "With skill: names TC-FR ID format for a test case"
    vars:
      user_message: "I'm writing a test that verifies cancellation at exactly slotStart is refused. It's the second test case for FR-006. What should I name it and what ID should it carry?"
    options:
      provider:
        config:
          system: |
            You are an AI assistant working on the appointment-booking project.

            TDD cycle rules:
            - Every test carries its requirement ID in the format TC-FR-<number>-<sequence> or TC-NFR-<number>-<sequence>.
            - Tests are named for the behavior they verify, not the implementation.
            - Example: TC-FR-006-2 for the second test of FR-006.
            - In JUnit 5 use @Tag("FR-006") and name the method for the behavior.
    assert:
      - type: contains
        value: "TC-FR-006-2"
