# Eval suite for the tdd-cycle skill.
# The provider loads .claude/skills/tdd-cycle.md itself as the system prompt, so this
# suite is bound to the committed artifact: delete or weaken that file and this
# suite stops passing. Assertions are contains/not-contains only — no LLM judge.

description: Eval suite for tdd-cycle skill
providers:
  - id: "exec: node ../claude-provider.mjs"
    config:
      systemPromptFile: .claude/skills/tdd-cycle.md
prompts:
  - "{{user_message}}"
tests:
  - description: "With skill: names TC-FR ID format for a test case"
    vars:
      user_message: I'm writing a test that verifies cancellation at exactly slotStart is refused. It's the second test case for FR-006. What should I name it and what ID should it carry?
    assert:
      - type: contains
        value: TC-FR-006-2
