name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: zulu
          cache: gradle

      - name: Run booking-service tests
        run: ./gradlew :booking-service:test

      - name: Run notification-service tests
        run: ./gradlew :notification-service:test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: services/*/build/reports/tests/

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: services/*/build/test-results/**/*.xml

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm --filter frontend test --reporter=junit --outputFile=vitest-results.xml

      - name: Upload frontend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: frontend/vitest-results.xml
