name: Eval Suites

# Informational — does not gate pull requests but records results per NFR-012 item 1.
# One eval suite per skill from Engineering standards as artifacts.
# One separate job (withheld-skill-proof) proves each suite FAILS without its skill.

on:
  push:
    branches: [main]
  pull_request:

# Authenticated by a Claude subscription OAuth token (`claude setup-token`),
# not an Anthropic API key. The provider shells out to the Claude Code CLI.
env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

jobs:
  eval-suites:
    name: Skill eval suites (with skill loaded)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - escalation-protocol
          - spec-authority
          - code-standard
          - tdd-cycle
          - java-patterns
          - secure-coding
          - deterministic-tests
          - requirement-docs
          - test-design
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install promptfoo and the Claude Code CLI
        run: npm install -g promptfoo @anthropic-ai/claude-code

      - name: Run eval suite for ${{ matrix.skill }}
        run: |
          promptfoo eval \
            --config .claude/evals/${{ matrix.skill }}/promptfooconfig.yaml \
            --output eval-results-${{ matrix.skill }}.json \
            --no-cache
        env:
          SKILL_NAME: ${{ matrix.skill }}

      # Diagnostic only, never changes the outcome. Retries are banned (NFR-001),
      # so a red run stays red — this makes it readable: an assertion the skill
      # failed to produce and a quota or transport fault look identical in
      # promptfoo's `error` field otherwise.
      - name: Classify the run
        if: always()
        run: |
          node .claude/evals/summarize-run.mjs             "${{ matrix.skill }}"             "eval-results-${{ matrix.skill }}.json"

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.skill }}
          path: eval-results-${{ matrix.skill }}.json

  withheld-skill-proof:
    name: Withheld-skill proof (must fail)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - escalation-protocol
          - spec-authority
          - code-standard
          - tdd-cycle
          - java-patterns
          - secure-coding
          - deterministic-tests
          - requirement-docs
          - test-design
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install promptfoo and the Claude Code CLI
        run: npm install -g promptfoo @anthropic-ai/claude-code

      - name: Run withheld eval for ${{ matrix.skill }} (expected to fail)
        id: withheld-eval
        run: |
          promptfoo eval \
            --config .claude/evals/${{ matrix.skill }}/promptfooconfig-withheld.yaml \
            --output withheld-results-${{ matrix.skill }}.json \
            --no-cache
        continue-on-error: true
        env:
          SKILL_NAME: ${{ matrix.skill }}

      # A non-zero exit from the runner is not evidence on its own: an invalid
      # model id, a missing key, or a network fault also exits non-zero. The
      # verifier requires that the provider answered every case AND that an
      # assertion genuinely failed. See NFR-012 item 1.
      - name: Verify the withheld-skill proof is genuine
        run: |
          node .claude/evals/verify-withheld.mjs \
            "${{ matrix.skill }}" \
            "withheld-results-${{ matrix.skill }}.json"


      - name: Upload withheld eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: withheld-results-${{ matrix.skill }}
          path: withheld-results-${{ matrix.skill }}.json
