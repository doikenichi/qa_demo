name: Review Agents

# Advisory only — findings are recorded on every pull request including clean runs.
# A finding never blocks a merge (AI-assisted SDLC; NFR-012 item 2). Every step
# below is continue-on-error for that reason: no AI step can pass or fail the build.
#
# Authenticated by a Claude subscription OAuth token (`claude setup-token`), not an
# Anthropic API key.

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  run-review-agents:
    name: Run review agents
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - standards-reviewer
          - stability-reviewer
          - test-layering-reviewer
          - traceability-auditor
          - security-reviewer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run ${{ matrix.agent }}
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Comment on a pull_request event rather than waiting for a trigger phrase.
          track_progress: true
          # One comment per agent: a sticky comment would have the five matrix legs
          # overwrite each other.
          use_sticky_comment: false
          prompt: |
            Read `.claude/agents/${{ matrix.agent }}.md`. That file is the review
            standard — apply exactly it, and nothing else, to the diff of this pull
            request against its base branch.

            The specification is `appointment-booking-project.md`. Cite rules and
            requirements by their identifier rather than restating them.

            Post one comment titled "Review agent: `${{ matrix.agent }}`" and begin it
            with the line:
            "> **Advisory only** — a finding never blocks merge."

            Report every finding with its file and line. If you find nothing, say so
            explicitly — write that the run was clean and that you found no findings.
            A clean run is required evidence, so never end without a comment.

            Do not modify any file. Review only.
          claude_args: |
            --max-turns 8
            --disallowedTools "Edit,Write,NotebookEdit"
