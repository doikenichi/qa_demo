image:
  repository: ghcr.io/placeholder/notification-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8081

secretName: notification-service-secrets

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db-postgresql:5432/notification
  SPRING_KAFKA_BOOTSTRAP_SERVERS: appointment-booking-kafka:9092

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
