apiVersion: v2
name: appointment-booking
description: >
  Umbrella chart for the appointment booking application.
  Installs booking-service, notification-service, and their infrastructure
  (PostgreSQL x2, Redis, Kafka). See charts/library for shared templates.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: booking-service
    version: "0.1.0"
    repository: "file://../booking-service"
  - name: notification-service
    version: "0.1.0"
    repository: "file://../notification-service"
# Infrastructure subcharts (booking-db, notification-db, redis, kafka) arrive at
# milestone 5, which is where the exit criteria place installing this chart over
# Postgres, Redis, and Kafka. Milestone 0 only requires the base chart to lint.
# They are deliberately not pinned here: the upstream index prunes older chart
# versions, so a pin chosen now would be unresolvable by the time it is used.
# Their values are staged, commented, in values.yaml.
