# Default values for the appointment-booking umbrella chart.
# Override per environment in a separate values file.
# Secrets (STAFF_API_TOKEN, OTEL credentials) are injected as Kubernetes Secrets
# and referenced via secretKeyRef — never hardcoded here (NFR-005).

booking-service:
  image:
    repository: ghcr.io/placeholder/booking-service
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  env:
    APP_TIME_ZONE: Europe/Berlin
  secretName: booking-service-secrets

notification-service:
  image:
    repository: ghcr.io/placeholder/notification-service
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8081
  secretName: notification-service-secrets

